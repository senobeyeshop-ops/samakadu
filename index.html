<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parole — s’entraîner à parler en public</title>
<link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:400 800;src:url(fonts/bricolage-grotesque.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#eef1f4;--ink:#101828;--mut:#52607a;--s:#1d4ed8;--e:#b4235a;--a:#0f766e;--line:#cfd6e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px)}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;text-decoration:none}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 64px}
.hero{padding:32px 0 40px}.hero h1{font-size:clamp(40px,8vw,84px);font-weight:800;max-width:11ch}
.hero p{max-width:52ch;color:var(--mut)}
.band{display:flex;flex-direction:column;justify-content:flex-end;min-height:190px;padding:24px clamp(16px,4vw,40px);color:#fff;text-decoration:none;margin:0 calc(-1 * clamp(16px,4vw,48px))}
.band h2{font-size:clamp(34px,6vw,60px);font-weight:800}.band span{opacity:.9;max-width:60ch}
.band:hover h2{text-decoration:underline;text-underline-offset:6px}
.lesson-list a{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.lesson-list a:hover{color:var(--c)}
.box{max-width:420px;margin:40px auto;display:grid;gap:12px}
input,textarea{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:200px}
.prose{max-width:62ch}.task{border-left:6px solid var(--c);padding:4px 0 4px 16px;margin:24px 0;font-weight:600}
.fb{background:#fff;border-left:6px solid var(--c);padding:16px;white-space:pre-wrap;margin-top:16px;max-width:62ch}
.err{color:#b42318;font-weight:600}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.crumb{color:var(--mut);text-decoration:none}
.okm{color:#067647;font-weight:600}.box h2{font-size:28px}
button.link{background:none;border:0;padding:4px 0;color:var(--s);text-decoration:underline;font-size:15px}
label{display:grid;gap:4px}
.mut{color:var(--mut)}small{font-size:14px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#067647;color:#fff;font-weight:700;font-size:14px;text-decoration:none;margin-right:8px}
.pill.up{background:#f59e0b;color:var(--ink)}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600}
.sk{background:linear-gradient(90deg,#dfe4ea 25%,#e9edf2 50%,#dfe4ea 75%);background-size:200% 100%;border-radius:8px;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.timer{display:flex;align-items:center;gap:12px;font:700 28px "Bricolage Grotesque",system-ui,sans-serif;margin:16px 0}
.timer button{font-size:16px;padding:6px 12px}.timer.over #tv{color:#b42318}
.subject{font-weight:700;font-size:20px;padding:12px 16px;background:#fff;border-left:6px solid var(--c);max-width:62ch}
.plans{display:grid;gap:12px;max-width:560px}
.plan{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;background:#fff;border:2px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.plan input{width:auto;grid-row:span 2}.plan small{grid-column:2 / 4}.plan:has(input:checked){border-color:var(--ink)}
.price{font:800 22px "Bricolage Grotesque",system-ui,sans-serif}
.pay{border:2px solid var(--line);border-radius:8px;display:flex;gap:24px;padding:12px 16px}.pay label{display:flex;gap:8px;align-items:center}.pay input{width:auto}
.fb.live::after{content:"▍";animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.pill.adm{background:var(--ink)}
select{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.h2{font-size:28px;margin:40px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:#fff;border-radius:8px;padding:14px 16px;display:grid;gap:4px}.tile strong{font:800 26px "Bricolage Grotesque",system-ui,sans-serif}
.tile span{font-size:14px}.tile.wide{grid-column:1/-1}
.tbl{overflow-x:auto;background:#fff;border-radius:8px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.st-paid{color:#067647;font-weight:700}.st-failed,.st-expired{color:#b42318}.st-pending{color:#b45309}
@media (prefers-reduced-motion:reduce){.sk,.fb.live::after{animation:none}}
@media (prefers-reduced-motion:no-preference){.band{transition:padding-left .2s}.band:hover{padding-left:calc(clamp(16px,4vw,40px) + 12px)}}
</style></head><body>
<header><a class="logo" href="#/">Parole</a><span id="who"></span></header>
<main id="app"></main>
<script src="config.js" defer></script>
<script src="vendor/supabase.js" defer></script>
<script src="app.js" defer></script></body></html>
